name = "atprotozoa-wordping"
compatibility_date = "2025-01-01"

# Static site: the browser does everything (follow graph fetch, Jetstream
# subscription, word matching). No Worker entrypoint, no server state.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table.
routes = [
  { pattern = "wordping.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
