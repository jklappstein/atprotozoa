name = "atprotozoa-firstsight"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @norvid-studies.bsky.social: "first tweet of someone's you ever saw" + "first
# tweet of theirs you liked" as a spotify-wrapped-ish thing. Downloads the
# handle's repo CAR (com.atproto.sync.getRepo) and, per author, keeps the
# earliest post of theirs the account engaged with (like/repost/reply/quote)
# and the earliest one it liked. Public reads only. See public/lib/firstsight.js.

routes = [
  { pattern = "firstsight.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
