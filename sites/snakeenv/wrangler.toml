name = "atprotozoa-snakeenv"
compatibility_date = "2025-01-01"

# Pure static site — a snake game where you play the environment and the
# snake plays itself. Canvas + vanilla JS, no server.
main = "src/index.ts"

routes = [
  { pattern = "snakeenv.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
