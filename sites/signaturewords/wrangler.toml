name = "atprotozoa-signaturewords"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @norvid-studies.bsky.social posted "my 50 signature words"; the ask was an
# app that does it for anyone. Public reads only: one getRepo download, count
# words in the browser. See public/lib/words.js.

routes = [
  { pattern = "signaturewords.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
