name = "atprotozoa-watchorder"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @norvid-studies.bsky.social: rank your YouTube watch-later pile by pairwise
# duels, then watch it in that order. Everything lives in the browser (localStorage).

routes = [
  { pattern = "watchorder.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
