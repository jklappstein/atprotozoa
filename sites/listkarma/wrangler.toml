name = "atprotozoa-listkarma"
compatibility_date = "2025-01-01"
main = "src/index.ts"

# Pure static site. Constellation (listitem backlinks to your DID) finds who
# listed you; slingshot reads each listitem record to learn which list;
# the AppView names the list. Sign-in is create-only on app.bsky.graph.listitem.

routes = [
  { pattern = "listkarma.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
