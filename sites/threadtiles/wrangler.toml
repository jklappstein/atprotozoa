name = "atprotozoa-threadtiles"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fully static: the thread is fetched from the public AppView in the browser.
#
# routes MUST stay above [assets] (keys after a table header join that table).
routes = [{ pattern = "threadtiles.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
