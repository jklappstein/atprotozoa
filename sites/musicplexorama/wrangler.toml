name = "atprotozoa-musicplexorama"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @norvid-studies.bsky.social asked (for @moultano.bsky.social) for a ternary
# plot of music genres split between melody, harmony and rhythm. Fully static.

routes = [
  { pattern = "musicplexorama.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
