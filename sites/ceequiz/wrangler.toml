name = "atprotozoa-ceequiz"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# @norvid-studies.bsky.social: a "@cee.wtf or @wagrace.mir.cee.wtf" quiz with
# gameshow graphics, an original score and a celebrity cameo. Public reads only:
# both repos are downloaded whole (getRepo) in the browser, see public/lib/quiz.js.

routes = [
  { pattern = "ceequiz.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
