<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dimensions</title>
<meta name="description" content="Every Bluesky post, live, folded into a space-filling Hilbert curve you can raise from 2 to 8 dimensions. A stream you will never read.">
<meta property="og:title" content="dimensions">
<meta property="og:description" content="Every Bluesky post, live, folded into a space-filling Hilbert curve you can raise from 2 to 8 dimensions. A stream you will never read.">
<meta property="og:image" content="https://dimensions.bisks.net/og.png">
<meta property="og:url" content="https://dimensions.bisks.net/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://dimensions.bisks.net/og.png">
<style>
  html,body{margin:0;height:100%;background:#000;color:#9ab;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  header{position:fixed;top:12px;left:16px;right:16px;pointer-events:none}
  h1{margin:0;font-size:18px;font-weight:600;color:#dfe8ff;letter-spacing:.08em}
  .sub{opacity:.7}
  #stats{margin-top:6px;opacity:.85;font-variant-numeric:tabular-nums}
  #panel{position:fixed;left:16px;bottom:56px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#000a;padding:8px 10px;border:1px solid #234;border-radius:6px}
  #panel label{display:flex;gap:8px;align-items:center}
  #dimval{color:#fff;font-size:18px;min-width:1ch}
  button,a.btn{font:inherit;color:#cde;background:#0b1424;border:1px solid #2a4468;border-radius:4px;padding:4px 10px;cursor:pointer;text-decoration:none}
  button:hover,a.btn:hover{background:#12223c}
  button.on{background:#27508a;color:#fff}
  #ticker{position:fixed;right:12px;top:12px;bottom:56px;width:min(34vw,420px);overflow:hidden;pointer-events:none;
    display:flex;flex-direction:column;justify-content:flex-end;font-size:10px;line-height:1.25;color:#7fb6ff;opacity:.55;
    -webkit-mask-image:linear-gradient(to bottom,transparent,#000 40%);mask-image:linear-gradient(to bottom,transparent,#000 40%)}
  #ticker div{white-space:nowrap;overflow:hidden;text-overflow:clip}
  footer{position:fixed;left:16px;right:16px;bottom:14px;display:flex;gap:14px;flex-wrap:wrap;opacity:.65;font-size:12px}
  footer a{color:#9cf}
  #status{color:#fc8}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<header>
  <h1>DIMENSIONS</h1>
  <div class="sub">a stream of information you will never read, folded into space</div>
  <div id="stats"><span id="status">connecting to the firehose…</span></div>
</header>
<div id="ticker" aria-hidden="true"></div>
<div id="panel">
  <label>dimensions <input id="dim" type="range" min="2" max="8" step="1" value="3"> <span id="dimval">3</span></label>
  <button id="ascend" type="button">ascend</button>
  <a class="btn" id="share" target="_blank" rel="noopener">share</a>
</div>
<footer>
  <span>each point is one post, placed along an n-dimensional hilbert curve in arrival order</span>
  <a href="https://rateyourbuild.bisks.net/site/dimensions">rate this on rateyourbuild →</a>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
