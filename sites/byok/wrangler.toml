name = "atprotozoa-byok"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "byok.bisks.net/*", zone_name = "bisks.net" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Optional hosted Hydracept (same secrets as dreamloom if you use both):
#   HYDRACEPT_API_KEY, HYDRACEPT_PROJECT, HYDRACEPT_ENVIRONMENT
