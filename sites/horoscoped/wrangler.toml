name = "atprotozoa-horoscoped"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Everything runs in the browser (public/app.js); the Worker just serves assets.
#
# routes MUST stay above [assets] — in TOML, keys after a table header join
# that table, so a routes line below [assets] silently becomes assets.routes.
routes = [{ pattern = "horoscoped.bisks.net/*", zone_name = "bisks.net" }]

[assets]
directory = "./public"
binding = "ASSETS"
